<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1945, 그 날</title>
<!-- html2canvas 라이브러리 추가 (인증서 이미지 파일 저장용) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root{
    --paper: #eee3c8;
    --paper-dark: #ddcfa8;
    --paper-shadow: #b9a877;
    --ink: #2a231a;
    --ink-soft: #554836;
    --indigo: #1c2a47;
    --indigo-soft: #2b3d63;
    --red: #a4291f;
    --red-soft: #c23b32;
    --blue: #26437c;
    --gold: #b8901f;
    --gold-bright: #e0b23f;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, #2a3452 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #241a2e 0%, transparent 50%),
      var(--indigo);
    font-family:'Noto Serif KR', serif;
    color:var(--ink);
    overflow-x:hidden;

    word-break: keep-all;
    overflow-wrap: break-word;
  }

  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:680px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 4px),
      var(--paper);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.05);
    clip-path: polygon(
      0.5% 2%, 4% 0%, 12% 1%, 22% 0.3%, 35% 1.2%, 48% 0%, 61% 0.8%, 74% 0%, 88% 1%, 97% 0%, 100% 3%,
      99.3% 12%, 100% 24%, 99.4% 37%, 100% 50%, 99.3% 63%, 100% 76%, 99.5% 89%, 100% 97%,
      96% 100%, 88% 99.2%, 76% 100%, 63% 99.3%, 50% 100%, 37% 99.4%, 24% 100%, 12% 99.2%, 3% 100%,
      0% 96%, 0.7% 84%, 0% 71%, 0.6% 58%, 0% 45%, 0.5% 32%, 0% 19%, 0.4% 8%
    );
    animation: settle 0.6s ease-out;
  }
  @keyframes settle{
    from{ opacity:0; transform:translateY(14px) scale(0.99); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card-inner{ padding:38px 34px 32px; position:relative; }

  .progress{
    display:flex; gap:8px; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .progress .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--paper-shadow);
    border: 1px solid var(--ink-soft);
  }
  .progress .dot.done{ background: var(--red-soft); border-color: var(--red); }
  .progress .dot.current{
    background: var(--gold-bright);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,144,31,0.2);
  }

  .eyebrow{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    letter-spacing:0.25em;
    color: var(--ink);
    opacity:0.65;
    margin-bottom:6px;
  }

  h1.title{
    font-family:'Song Myung', serif;
    text-align:center;
    font-size:30px;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:0.02em;
    word-break: keep-all;
    text-wrap: balance;
  }
  h2.stage-title{
    font-family:'Song Myung', serif;
    text-align:center;
    font-size:22px;
    margin:0 0 18px;
    color:var(--indigo);
    word-break: keep-all;
    text-wrap: balance;
  }

  .subtitle{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink);
    opacity:0.7;
    margin-bottom:22px;
    word-break: keep-all;
    text-wrap: balance;
  }
  h2.stage-title{
    font-family:'Song Myung', serif;
    text-align:center;
    font-size:22px;
    margin:0 0 18px;
    color:var(--indigo);
  }

  .subtitle{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink);

    margin-bottom:22px;

    border: 1px dashed var(--paper-shadow);
    border-radius: 6px;
    padding: 18px 20px;
    margin: 20px 0;
  }
  .input-row {
    display: flex;
    flex-direction: column;

    margin-bottom: 14px;
    text-align: left;
  }
  .input-row:last-child { margin-bottom: 0; }
  .input-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--indigo);
  }
  .text-input, .textarea-input {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;

  .text-input:focus, .textarea-input:focus {

  }

  .scene{

  .scene-img-container {

    max-width: 520px;

  .scene-img-container img, .scene-img-container svg {

  .narration{

    line-height:1.85;

  .speaker-line {

  .choice-btn{

    border: 1px solid var(--paper-shadow);

  /* 실패 도장 */

  .stamp{

    font-size:15.5px; line-height:1.85; text-align:left;
    background: rgba(164,41,31,0.06);
    border-left: 3px solid var(--red-soft);
    padding: 14px 16px;
    margin: 4px 0 6px;
    word-break: keep-all;
    overflow-wrap: break-word;

  /* 엔딩 효과 & 인증서 스타일 */
  .ending-glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 20%, rgba(224,178,63,0.35), transparent 60%);
    pointer-events:none;
  }
  .taegeuk{ width:60px; height:60px; margin:0 auto 12px; display:block; }

  .recap{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    line-height:1.9;
    background: rgba(0,0,0,0.035);
    padding:16px;
    border-radius:6px;
    word-break: keep-all;
    overflow-wrap: break-word;

  /* 고풍스러운 전통 상장 형태의 인증서 스타일 */
  .certificate-frame {
    border: 3px solid var(--gold);
    outline: 8px double var(--gold);
    outline-offset: -12px;
    background: #faf6ed;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(224, 178, 63, 0.08), transparent 70%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.01) 0 2px, transparent 2px 4px);
    padding: 44px 36px 36px;
    border-radius: 4px;
    position: relative;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 0 30px rgba(184,144,31,0.1);
    margin: 12px 0;
    text-align: center;

  /* 귀퉁이 전통 문양 */

    position: absolute;
    width: 36px;
    height: 36px;

    opacity: 0.85;

  .cert-corner.top-left { top: 16px; left: 16px; }
  .cert-corner.top-right { top: 16px; right: 16px; transform: rotate(90deg); }
  .cert-corner.bottom-left { bottom: 16px; left: 16px; transform: rotate(-90deg); }
  .cert-corner.bottom-right { bottom: 16px; right: 16px; transform: rotate(180deg); }

  .cert-serial {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: left;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .cert-header {
    font-family: 'Song Myung', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--indigo);
    margin: 10px 0 2px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    text-shadow: 1px 1px 0px rgba(184,144,31,0.25);

  .cert-subtitle {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.32em;
    margin-bottom: 28px;
    font-weight: 700;
  }

  .cert-recipient-grid {
    display: table;
    margin: 0 auto 24px;
    text-align: left;
    font-family: 'Noto Serif KR', serif;
    font-size: 15.5px;
    border-bottom: 1px dashed var(--paper-shadow);
    padding-bottom: 16px;
    width: 90%;

  .cert-recipient-row { display: table-row; }
  .cert-recipient-label {
    display: table-cell;
    padding: 4px 16px 4px 0;
    font-weight: 700;
    color: var(--indigo);
    font-family: 'Noto Sans KR', sans-serif;

    width: 80px;
    white-space: nowrap;
  }
  .cert-recipient-val {
    display: table-cell;
    padding: 4px 0;
    color: var(--ink);
    font-weight: 600;
  }

  .cert-statement {
    font-family: 'Song Myung', serif;
    font-size: 16.5px;
    line-height: 2.0;
    color: var(--ink);
    margin: 20px 12px 24px;
    word-break: keep-all;
    text-align: justify;
    text-justify: interpunct;
  }

  .cert-reflection-wrapper {
    background: #f3ece0;
    border: 1px solid var(--paper-shadow);
    border-left: 5px solid var(--gold);
    border-radius: 4px;
    padding: 14px 18px;
    margin: 20px 10px 28px;
    text-align: left;
    position: relative;
  }
  .cert-reflection-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cert-reflection-box {
    font-family: 'Noto Serif KR', serif;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .cert-footer-group {
    margin-top: 30px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .cert-date {
    font-family: 'Song Myung', serif;
    font-size: 16px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
  }
  .cert-issuer-container {
    position: relative;
    display: inline-block;
    padding: 10px 20px;
  }
  .cert-issuer {
    font-family: 'Song Myung', serif;

  .cert-official-seal {
    position: absolute;
    right: -18px;
    top: -12px;
    width: 76px;
    height: 76px;
    border: 3px solid var(--red);
    border-radius: 4px;
    color: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Song Myung', serif;

    font-weight: 700;

    transform: rotate(-6deg);

  .rift{
    position:fixed; inset:0; z-index:50;

  .rift.active{
    animation: riftBurst 0.5s ease-out forwards;
  }
  @keyframes riftBurst{
    0%{ opacity:0.9; clip-path: polygon(48% 0,53% 8%,49% 20%,55% 33%,47% 46%,52% 58%,46% 71%,54% 84%,49% 100%,51% 100%,56% 85%,50% 72%,58% 60%,49% 47%,57% 34%,51% 21%,58% 9%,53% 0%); }
    100%{ opacity:0; clip-path: polygon(-20% -20%, 120% -20%, 120% 120%, -20% 120%); }

  .sound-toggle{
    position:fixed; top:14px; right:14px; z-index:60;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px; letter-spacing:0.04em;
    background: rgba(238,227,200,0.1);
    color: rgba(238,227,200,0.85);
    border: 1px solid rgba(238,227,200,0.35);

    body { background: white !important; }
    .sound-toggle, .action-row, .eyebrow, .subtitle { display: none !important; }

<body>

<div id="app"></div>
<div class="rift" id="rift"></div>
<button class="sound-toggle" id="soundToggle" aria-label="소리 켜기/끄기">🔊 소리 켬</button>

<script>
/* 구글 시트 연동 URL (설정 시 학생들의 결과가 시트로 전송됨) */
const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbycYKc5Pd9m1J2QG98LWcYQkgYspvecL828jm1plmNHeSSeP7xdoZE8pcInOGBikAqa_Q/exec"; 

// 사용자 등록 정보 데이터
const userData = {
  studentId: '',
  studentName: '',
  reflection: '',
  completedAt: ''
};

const Sound = {
  ctx:null, master:null, enabled:true,
  drone:null, statics:null, tick:null, wind:null, heartbeat:null, _nb:null,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.6 : 0;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggle(){
    this.enabled = !this.enabled;
    if(this.master) this.master.gain.value = this.enabled ? 0.6 : 0;
    return this.enabled;
  },
  noiseBuffer(){
    if(this._nb) return this._nb;
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this._nb = buf; return buf;
  },
  startDrone(vol = 0.08){
    if(!this.ctx) return;
    if(this.drone){
      this.drone.g.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.3);
      return;
    }
    const g = this.ctx.createGain(); g.gain.value = vol;
    const o1 = this.ctx.createOscillator(); o1.type='sine'; o1.frequency.value = 55;
    const o2 = this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value = 55.8;
    const o3 = this.ctx.createOscillator(); o3.type='triangle'; o3.frequency.value = 110;
    const g3 = this.ctx.createGain(); g3.gain.value = 0.15;
    o3.connect(g3); g3.connect(g);
    o1.connect(g); o2.connect(g); g.connect(this.master);
    o1.start(); o2.start(); o3.start();
    this.drone = {g,o1,o2,o3};
  },
  stopDrone(){
    if(!this.ctx || !this.drone) return;
    const {g,o1,o2,o3} = this.drone;
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
    setTimeout(()=>{ try{o1.stop();o2.stop();if(o3)o3.stop();}catch(e){} }, 700);
    this.drone = null;
  },
  startWind(level = 0.04){
    if(!this.ctx) return;
    if(this.wind){
      this.wind.g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.3);
      return;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer(); src.loop = true;
    const lp = this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 320;
    const g = this.ctx.createGain(); g.gain.value = 0;
    
    // 바람의 주기적 일렁임(LFO)
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.22;
    const lg = this.ctx.createGain(); lg.gain.value = 180;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start();
    g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.8);
    this.wind = {src, g, lfo};
  },
  stopWind(){
    if(!this.ctx || !this.wind) return;
    const w = this.wind;
    w.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
    setTimeout(()=>{ try{ w.src.stop(); w.lfo.stop(); }catch(e){} }, 600);
    this.wind = null;
  },
  startHeartbeat(){
    if(!this.ctx || this.heartbeat) return;
    const playBeat = () => {
      if(!this.ctx || !this.heartbeat) return;
      const t = this.ctx.currentTime;
      // 쿵 (Beat 1)
      const o1 = this.ctx.createOscillator(); const g1 = this.ctx.createGain();
      o1.type = 'sine'; o1.frequency.setValueAtTime(85, t);
      o1.frequency.exponentialRampToValueAtTime(28, t + 0.12);
      g1.gain.setValueAtTime(0.35, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o1.connect(g1); g1.connect(this.master); o1.start(t); o1.stop(t + 0.16);

      // 쾅 (Beat 2)
      const o2 = this.ctx.createOscillator(); const g2 = this.ctx.createGain();
      o2.type = 'sine'; o2.frequency.setValueAtTime(65, t + 0.18);
      o2.frequency.exponentialRampToValueAtTime(22, t + 0.3);
      g2.gain.setValueAtTime(0.25, t + 0.18); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o2.connect(g2); g2.connect(this.master); o2.start(t + 0.18); o2.stop(t + 0.35);
    };
    playBeat();
    this.heartbeat = setInterval(playBeat, 1050);
  },
  stopHeartbeat(){
    if(this.heartbeat){ clearInterval(this.heartbeat); this.heartbeat = null; }
  },
  startStatic(level){
    if(!this.ctx) return;
    if(this.statics){
      this.statics.g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.4);
      return;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer(); src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=0.8;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start();
    g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.6);
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 6.3;
    const lg = this.ctx.createGain(); lg.gain.value = level * 0.5;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    this.statics = {src,g,lfo};
  },
  stopStatic(){
    if(!this.ctx || !this.statics) return;
    const s = this.statics;
    s.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
    setTimeout(()=>{ try{s.src.stop();s.lfo.stop();}catch(e){} }, 700);
    this.statics = null;
  },
  startTick(){
    if(!this.ctx || this.tick) return;
    this.tick = setInterval(()=>{ this.blip(1400, 0.025, 0.05, 'square'); }, 1000);
  },
  stopTick(){ if(this.tick){ clearInterval(this.tick); this.tick = null; } },
  blip(freq, dur, vol, type){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + dur + 0.05);
  },
  click(){ this.blip(520, 0.06, 0.05); },
  fail(){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(200, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.55);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.11, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + 0.65);
  },
  pluck(freq, dur, vol){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value = freq;
    const h = this.ctx.createOscillator(); h.type='sine'; h.frequency.value = freq*2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    const hg = this.ctx.createGain(); hg.gain.value = 0.3;
    o.connect(g); h.connect(hg); hg.connect(g); g.connect(this.master);
    o.start(); h.start();
    o.stop(this.ctx.currentTime + dur); h.stop(this.ctx.currentTime + dur);
  },
  liberation(){
    if(!this.ctx) return;
    const notes = [392, 493.88, 587.33, 783.99, 987.77];
    notes.forEach((f,i)=>{ setTimeout(()=>this.pluck(f, 1.8, 0.11), i*190); });
    setTimeout(()=>{ this.pluck(783.99, 3, 0.09); this.pluck(587.33, 3, 0.06); }, notes.length*190 + 260);
  },
  scene(id){
    if(!this.ctx) return;
    this.stopTick();
    this.stopHeartbeat();
    if(id === 'intro'){ 
      this.stopDrone(); this.stopStatic(); this.stopWind(); 
    }
    else if(id === 's1'){ 
      // STAGE 1: 낯선 골목 - 스산한 골목 바람 소리 + 묵직한 베이스 드론
      this.startDrone(0.08); 
      this.startWind(0.05); 
      this.stopStatic(); 
    }
    else if(id === 's2'){ 
      // STAGE 2: 벽보와 청년 - 은밀한 긴장감, 바람 소리와 잔잔한 노이즈
      this.startDrone(0.09); 
      this.startWind(0.03); 
      this.startStatic(0.015); 
    }
    else if(id === 's3'){ 
      // STAGE 3: 검문 - 순사 검문, 긴장감 넘치는 쿵쾅거리는 심장 소리(Heartbeat)
      this.startDrone(0.12); 
      this.stopWind(); 
      this.startStatic(0.02); 
      this.startHeartbeat(); 
    }
    else if(id === 's4'){ 
      // STAGE 4: 다락방 라디오
      this.startDrone(0.09); 
      this.stopWind(); 
      this.startStatic(0.035); 
    }
    else if(id === 's4b'){ 
      // STAGE 4b: 정오 5분 전 - 시계 초침 + 라디오 잡음
      this.startDrone(0.1); 
      this.stopWind(); 
      this.startStatic(0.05); 
      this.startTick(); 
    }
    else if(id === 's5'){ 
      // STAGE 5: 정오 방송
      this.startDrone(0.12); 
      this.stopWind(); 
      this.startStatic(0.07); 
    }
    else if(id === 'ending' || id === 'certificate'){ 
      this.stopDrone(); 
      this.stopStatic(); 
      this.stopWind(); 
      this.liberation(); 
    }
  }
};

function handleImgError(img, fallbackKey) {
  const fallbacks = JSON.parse(img.dataset.fallbacks || '[]');
  if (fallbacks.length > 0) {
    const nextSrc = fallbacks.shift();
    img.dataset.fallbacks = JSON.stringify(fallbacks);
    img.src = nextSrc;
  } else {
    img.style.display = 'none';
    const svgEl = img.nextElementSibling;
    if (svgEl) svgEl.style.display = 'block';
  }
}

function getImageHtml(sources, alt, fallbackKey) {
  const primarySrc = sources[0];
  const secondarySrcs = JSON.stringify(sources.slice(1));
  return `<div class="scene-img-container">
    <img src="${primarySrc}" alt="${alt}" data-fallbacks='${secondarySrcs}' onerror="handleImgError(this, '${fallbackKey}')">
    <div class="svg-fallback" style="display:none; width:100%; height:100%;">${SVG_FALLBACKS[fallbackKey]}</div>
  </div>`;
}

let currentId = 'intro';

const app = document.getElementById('app');
const riftEl = document.getElementById('rift');

function fireRift(cb){
  riftEl.classList.remove('active');
  void riftEl.offsetWidth;
  riftEl.classList.add('active');
  setTimeout(cb, 180);
}

function progressDots(activeStageNum){
  let dots = '';
  for(let i=1;i<=STAGES;i++){
    let cls = 'dot';
    if(i < activeStageNum) cls += ' done';
    else if(i === activeStageNum) cls += ' current';
    dots += `<span class="${cls}"></span>`;
  }
  return `<div class="progress">${dots}</div>`;
}

function sendToGoogleSheet() {
  if (!GOOGLE_SHEETS_URL) return;
  try {
    fetch(GOOGLE_SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        timestamp: userData.completedAt,
        studentId: userData.studentId,
        studentName: userData.studentName,
        reflection: userData.reflection
      })
    });
  } catch (e) {
    console.log("시트 전송 실패:", e);
  }
}

          <button class="action-btn" id="downloadImgBtn">📸 인증서 이미지 저장 (.png)</button>
          <button class="action-btn secondary" id="printBtn">🖨️ 인쇄 / PDF 저장</button>
          <button class="action-btn secondary" id="restartAllBtn">처음부터 다시 하기</button>
        </div>
      </div></div>
    `;

    // 이미지 저장 기능 (GitHub Pages 고해상도 대응 보완)
    document.getElementById('downloadImgBtn').onclick = () => {
      Sound.click();
      const certEl = document.getElementById('certFrame');
      if (window.html2canvas && certEl) {
        // 구글 웹폰트 로딩이 완전히 완료된 후 캡처 실행 (글자 깨짐 방지)
        document.fonts.ready.then(() => {
          html2canvas(certEl, {
            scale: 3, // 3배율 고해상도 렌더링 (선명도 대폭 향상)
            backgroundColor: '#faf6ed',
            useCORS: true, // GitHub Pages 배포 시 외부 폰트/이미지 보안 차단 방지
            allowTaint: true,
            logging: false
          }).then(canvas => {
            const link = document.createElement('a');
            link.download = `1945_광복절_체험인증서_${userData.studentName || '인증서'}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
          }).catch(err => {
            console.error('이미지 생성 오류:', err);
            window.print();
          });
        });
      } else {
        window.print();
      }
    };

    document.getElementById('printBtn').onclick = () => {
      Sound.click();
      window.print();
    };

    document.getElementById('restartAllBtn').onclick = () => {
      userData.studentId = '';
      userData.studentName = '';
      userData.reflection = '';
      Sound.click();
      go('intro');
    };
    return;
  }
}

function showAfter(s, choice){
  app.innerHTML = `
    <div class="card"><div class="card-inner">
      ${progressDots(s.stageNum)}
      <div class="eyebrow">STAGE ${s.stageNum} / ${STAGES}</div>
      <h2 class="stage-title">${s.title}</h2>
      <div class="scene">${s.scene}</div>
      <div class="narration">${choice.after}</div>
      <button class="start-btn" id="nextBtn">다음으로</button>
    </div></div>
  `;
  document.getElementById('nextBtn').onclick = () => { Sound.click(); go(choice.next); };
}

function showFail(s, choice){
  Sound.fail();
  Sound.stopTick();
  Sound.stopStatic();
  app.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="fail-wrap">
        <div class="stamp">실패</div>
      </div>
      <h2 class="stage-title">${s.title}</h2>
      <div class="fail-text">${choice.fail}</div>
      <div class="action-row">
        <button class="action-btn" id="retryStageBtn">이 장면부터 다시</button>
        <button class="action-btn secondary" id="restartAllBtn">처음부터 다시</button>
      </div>
    </div></div>
  `;
  document.getElementById('retryStageBtn').onclick = () => { Sound.click(); go(currentId); };
  document.getElementById('restartAllBtn').onclick = () => { Sound.click(); go('intro'); };
}

function go(id){
  fireRift(() => {
    currentId = id;
    render();
    Sound.scene(id);
    window.scrollTo({top:0, behavior:'auto'});
  });
}

render();
</script>
</body>
</html>
