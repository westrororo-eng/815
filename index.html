<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1945, 균열의 문 — 역사 탈출 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root{
    --paper: #eee3c8;
    --paper-dark: #ddcfa8;
    --paper-shadow: #b9a877;
    --ink: #2a231a;
    --ink-soft: #55483660b3;
    --indigo: #1c2a47;
    --indigo-soft: #2b3d63;
    --red: #a4291f;
    --red-soft: #c23b32;
    --blue: #26437c;
    --gold: #b8901f;
    --gold-bright: #e0b23f;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, #2a3452 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #241a2e 0%, transparent 50%),
      var(--indigo);
    font-family:'Noto Serif KR', serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:680px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 4px),
      var(--paper);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.05);
    clip-path: polygon(
      0.5% 2%, 4% 0%, 12% 1%, 22% 0.3%, 35% 1.2%, 48% 0%, 61% 0.8%, 74% 0%, 88% 1%, 97% 0%, 100% 3%,
      99.3% 12%, 100% 24%, 99.4% 37%, 100% 50%, 99.3% 63%, 100% 76%, 99.5% 89%, 100% 97%,
      96% 100%, 88% 99.2%, 76% 100%, 63% 99.3%, 50% 100%, 37% 99.4%, 24% 100%, 12% 99.2%, 3% 100%,
      0% 96%, 0.7% 84%, 0% 71%, 0.6% 58%, 0% 45%, 0.5% 32%, 0% 19%, 0.4% 8%
    );
    animation: settle 0.6s ease-out;
  }
  @keyframes settle{
    from{ opacity:0; transform:translateY(14px) scale(0.99); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card-inner{ padding:38px 34px 32px; position:relative; }

  .progress{
    display:flex; gap:8px; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .progress .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--paper-shadow);
    border: 1px solid var(--ink-soft);
  }
  .progress .dot.done{ background: var(--red-soft); border-color: var(--red); }
  .progress .dot.current{
    background: var(--gold-bright);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,144,31,0.2);
  }

  .eyebrow{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    letter-spacing:0.25em;
    color: var(--ink);
    opacity:0.55;
    margin-bottom:6px;
  }

  h1.title{
    font-family:'Song Myung', serif;
    text-align:center;
    font-size:30px;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:0.02em;
  }
  h2.stage-title{
    font-family:'Song Myung', serif;
    text-align:center;
    font-size:22px;
    margin:0 0 18px;
    color:var(--indigo);
  }

  .subtitle{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink);
    opacity:0.6;
    margin-bottom:22px;
  }

  .scene{
    display:flex; justify-content:center; margin: 6px 0 22px;
  }
  .scene svg{
    width:100%;
    max-width:520px;
    height:auto;
    border-radius:6px;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.35);
    border: 1px solid rgba(0,0,0,0.12);
  }

  .narration{
    font-size:16.5px;
    line-height:1.85;
    color:var(--ink);
    margin: 0 0 26px;
    padding: 0 2px;
  }
  .narration .speaker{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    color:var(--indigo);
  }

  .prompt{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--red);
    margin-bottom:12px;
    text-align:center;
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice-btn{
    font-family:'Noto Serif KR', serif;
    font-size:15.5px;
    text-align:left;
    background: rgba(255,255,255,0.35);
    border: 1px solid var(--paper-shadow);
    border-left: 4px solid var(--indigo-soft);
    padding: 13px 16px;
    border-radius: 2px;
    cursor:pointer;
    color:var(--ink);
    transition: all 0.15s ease;
  }
  .choice-btn:hover{
    background: rgba(255,255,255,0.65);
    border-left-color: var(--gold);
    transform: translateX(2px);
  }
  .choice-btn:focus-visible{
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }

  .start-btn, .action-btn{
    display:block;
    margin: 24px auto 0;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.03em;
    background: var(--indigo);
    color: var(--paper);
    border:none;
    padding: 13px 30px;
    border-radius: 3px;
    cursor:pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .start-btn:hover, .action-btn:hover{ background: var(--indigo-soft); transform: translateY(-1px); }
  .action-btn.secondary{
    background: transparent;
    color: var(--indigo);
    border: 1px solid var(--indigo);
  }
  .action-btn.secondary:hover{ background: rgba(28,42,71,0.06); }
  .action-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px; }

  /* Fail stamp */
  .fail-wrap{ text-align:center; }
  .stamp{
    display:inline-block;
    font-family:'Song Myung', serif;
    font-size:34px;
    color: var(--red);
    border: 4px solid var(--red);
    padding: 6px 22px;
    border-radius: 6px;
    transform: rotate(-7deg);
    margin: 4px auto 18px;
    opacity:0.9;
    animation: stampDown 0.35s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes stampDown{
    0%{ transform: rotate(-7deg) scale(2.6); opacity:0; }
    60%{ opacity:1; }
    100%{ transform: rotate(-7deg) scale(1); opacity:0.9; }
  }
  .fail-text{
    font-size:15.5px; line-height:1.85; text-align:left;
    background: rgba(164,41,31,0.06);
    border-left: 3px solid var(--red-soft);
    padding: 14px 16px;
    margin: 4px 0 6px;
  }

  /* Ending */
  .ending-glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 20%, rgba(224,178,63,0.35), transparent 60%);
    pointer-events:none;
  }
  .taegeuk{ width:64px; height:64px; margin:0 auto 14px; display:block; }

  .recap{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    line-height:1.9;
    background: rgba(0,0,0,0.035);
    border-radius:4px;
    padding: 14px 18px;
    margin-top: 18px;
  }
  .recap b{ color:var(--indigo); }

  .rift{
    position:fixed; inset:0; z-index:50;
    background:var(--ink);
    clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%);
    pointer-events:none;
    opacity:0;
  }
  .rift.active{
    animation: riftBurst 0.5s ease-out forwards;
  }
  @keyframes riftBurst{
    0%{ opacity:0.9; clip-path: polygon(48% 0,53% 8%,49% 20%,55% 33%,47% 46%,52% 58%,46% 71%,54% 84%,49% 100%,51% 100%,56% 85%,50% 72%,58% 60%,49% 47%,57% 34%,51% 21%,58% 9%,53% 0%); }
    100%{ opacity:0; clip-path: polygon(-20% -20%, 120% -20%, 120% 120%, -20% 120%); }
  }

  footer.credit{
    text-align:center; margin-top:22px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:11px; color: rgba(238,227,200,0.5);
  }

  .sound-toggle{
    position:fixed; top:14px; right:14px; z-index:60;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px; letter-spacing:0.04em;
    background: rgba(238,227,200,0.1);
    color: rgba(238,227,200,0.85);
    border: 1px solid rgba(238,227,200,0.35);
    padding: 7px 14px;
    border-radius: 20px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .sound-toggle:hover{ background: rgba(238,227,200,0.2); }

  @media (max-width:480px){
    .card-inner{ padding:28px 20px 24px; }
    h1.title{ font-size:24px; }
    .narration{ font-size:15.5px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="rift" id="rift"></div>
<button class="sound-toggle" id="soundToggle" aria-label="소리 켜기/끄기">🔊 소리 켬</button>

<script>
/* ---------- Sound engine (Web Audio, no external files) ---------- */
const Sound = {
  ctx:null, master:null, enabled:true,
  drone:null, statics:null, tick:null, _nb:null,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.6 : 0;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggle(){
    this.enabled = !this.enabled;
    if(this.master) this.master.gain.value = this.enabled ? 0.6 : 0;
    return this.enabled;
  },
  noiseBuffer(){
    if(this._nb) return this._nb;
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this._nb = buf; return buf;
  },
  startDrone(){
    if(!this.ctx || this.drone) return;
    const g = this.ctx.createGain(); g.gain.value = 0.05;
    const o1 = this.ctx.createOscillator(); o1.type='sine'; o1.frequency.value = 55;
    const o2 = this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value = 55.8;
    o1.connect(g); o2.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.drone = {g,o1,o2};
  },
  stopDrone(){
    if(!this.ctx || !this.drone) return;
    const {g,o1,o2} = this.drone;
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
    setTimeout(()=>{ try{o1.stop();o2.stop();}catch(e){} }, 700);
    this.drone = null;
  },
  startStatic(level){
    if(!this.ctx) return;
    if(this.statics){
      this.statics.g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.4);
      return;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuffer(); src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=0.8;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start();
    g.gain.linearRampToValueAtTime(level, this.ctx.currentTime + 0.6);
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 6.3;
    const lg = this.ctx.createGain(); lg.gain.value = level * 0.5;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    this.statics = {src,g,lfo};
  },
  stopStatic(){
    if(!this.ctx || !this.statics) return;
    const s = this.statics;
    s.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
    setTimeout(()=>{ try{s.src.stop();s.lfo.stop();}catch(e){} }, 700);
    this.statics = null;
  },
  startTick(){
    if(!this.ctx || this.tick) return;
    this.tick = setInterval(()=>{ this.blip(1400, 0.025, 0.05, 'square'); }, 1000);
  },
  stopTick(){ if(this.tick){ clearInterval(this.tick); this.tick = null; } },
  blip(freq, dur, vol, type){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + dur + 0.05);
  },
  click(){ this.blip(520, 0.06, 0.05); },
  fail(){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(200, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.55);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.11, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + 0.65);
  },
  pluck(freq, dur, vol){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value = freq;
    const h = this.ctx.createOscillator(); h.type='sine'; h.frequency.value = freq*2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    const hg = this.ctx.createGain(); hg.gain.value = 0.3;
    o.connect(g); h.connect(hg); hg.connect(g); g.connect(this.master);
    o.start(); h.start();
    o.stop(this.ctx.currentTime + dur); h.stop(this.ctx.currentTime + dur);
  },
  liberation(){
    if(!this.ctx) return;
    const notes = [392, 493.88, 587.33, 783.99, 987.77]; // G4 B4 D5 G5 B5
    notes.forEach((f,i)=>{ setTimeout(()=>this.pluck(f, 1.8, 0.11), i*190); });
    setTimeout(()=>{ this.pluck(783.99, 3, 0.09); this.pluck(587.33, 3, 0.06); }, notes.length*190 + 260);
  },
  scene(id){
    if(!this.ctx) return;
    this.stopTick();
    if(id === 'intro'){ this.stopDrone(); this.stopStatic(); }
    else if(id === 's1' || id === 's2' || id === 's3'){ this.startDrone(); this.stopStatic(); }
    else if(id === 's4'){ this.startDrone(); this.startStatic(0.03); }
    else if(id === 's4b'){ this.startDrone(); this.startStatic(0.045); this.startTick(); }
    else if(id === 's5'){ this.startDrone(); this.startStatic(0.06); }
    else if(id === 'ending'){ this.stopDrone(); this.stopStatic(); this.liberation(); }
  }
};

document.getElementById('soundToggle').addEventListener('click', ()=>{
  Sound.ensure();
  const on = Sound.toggle();
  document.getElementById('soundToggle').textContent = on ? '🔊 소리 켬' : '🔇 소리 끔';
});

    narration:`골목 담벼락에 붙은 전단 조각에서 <b>"연합군, 총공세"</b> <b>"신형 폭탄"</b> 같은 문구가 어렴풋이 보인다. 그때 한 청년이 조심스레 다가와 속삭인다.<br><br>
    <span class="speaker">청년(동만)</span> "거긴 위험해요… 근데, 낯선 분이시네요. 지금이 언제인지는 아세요?"`,
    prompt:'동만의 신뢰를 얻으려면, 지금은 몇 년쯤일까?',
    choices:[
      { text:'"1919년, 3·1운동이 일어난 해 아닌가요"', correct:false,
        fail:'전단에 적힌 "신형 폭탄"이라는 표현은 1945년 8월, 히로시마·나가사키에 원자폭탄이 투하된 사건을 가리킨다. 1919년의 상황과는 맞지 않는다.' },
      { text:'"1945년, 일본의 패망이 임박한 시점 같아요"', correct:true, next:'s3',
        after:'<span class="speaker">동만</span> "맞아요… 곧 무슨 일이 벌어질 것 같은데, 다들 쉬쉬하고 있어요. 순사 눈에 띄면 큰일 나니 조심하세요."' },
      { text:'"1937년, 중일전쟁이 시작된 해 같아요"', correct:false,
        fail:'중일전쟁은 1937년에 시작되었지만, 전단 속 "연합군 총공세"와 "신형 폭탄"이라는 표현은 전쟁이 막바지에 이른 1945년의 상황을 가리킨다.' }
    ]
  },

  s3: {
    stageNum:3, type:'choice', scene: SVG.checkpoint,
    title:'3. 검문',
    narration:`골목을 벗어나려는데, 순사가 앞을 가로막는다.<br><br>
    <span class="speaker">순사</span> "거기, 신분증 좀 봅시다."<br>
    등줄기에 식은땀이 흐른다.`,
    prompt:'어떻게 대응해야 무사히 넘어갈 수 있을까?',
    choices:[
      { text:'"나는 미래에서 왔다"며 당당하게 저항한다', correct:false,
        fail:'황당한 말은 의심만 자초할 뿐이다. 이 시기엔 사소한 꼬투리 하나로도 끌려가 고초를 겪는 사람이 많았다. 침착함이 최선의 방어다.' },
      { text:'동만이 급히 건네준 낡은 신분증을 내밀며, 침착하게 대답한다', correct:true, next:'s4',
        after:'순사는 신분증을 힐끗 보더니 별말 없이 지나간다. 동만이 옆에서 조용히 숨을 내쉰다.' },
      { text:'뒤돌아 냅다 달아난다', correct:false,
        fail:'도망치는 행동은 오히려 의심을 키운다. 등 뒤에서 호루라기 소리가 요란하게 울리기 시작한다.' }
    ]
  },

  s4: {
    stageNum:4, type:'choice', scene: SVG.radio,
    title:'4. 다락방의 라디오',
    narration:`동만의 다락방. 낡은 라디오에서 지지직 잡음이 흐른다.<br><br>
    <span class="speaker">동만</span> "오늘 정오, 중대 발표가 있을 거래요. 근데… 이게 사실이라면, 우린 어떻게 해야 할까요?"`,
    prompt:'정오까지, 지금 당신은 어떻게 행동해야 할까?',
    choices:[
      { text:'동네방네 소문을 낸다 — "곧 우리가 해방된대!"', correct:false,
        fail:'정식 발표 전에 근거 없는 소문을 퍼뜨리는 건 위험하다. 아직 확실하지 않은 상황에서 섣부른 행동은 오히려 화를 부를 수 있다. 정오까지는 차분히 기다려야 한다.' },
      { text:'정오까지 침착하게 기다리며, 라디오 곁을 지킨다', correct:true, next:'s4b' },
      { text:'순사 파출소로 찾아가 무슨 일이냐고 캐묻는다', correct:false,
        fail:'제 발로 위험 속에 걸어 들어가는 셈이다. 아직 정체가 불분명한 상황에서 스스로 의심을 사는 행동은 피해야 한다.' }
    ]
  },

  s4b: {
    stageNum:5, type:'story', scene: SVG.radio,
    title:'정오 5분 전',
    narration:`방 안의 공기가 팽팽하게 당겨진다.<br><br>
    소식을 들은 이웃들이 하나둘 다락방으로 모여들었다. 동만의 어머니는 마른 손으로 치맛자락만 만지작거리고, 옆집 노인은 라디오에 귀를 바짝 붙인 채 미동도 없다. 아무도 입을 열지 않는다. 괘종시계 초침 소리만이 유난히 크게 들린다.<br><br>
    <i>— 만약, 우리가 기다리던 소식이 아니라면 어떡하지. 아니… 만약, 정말 그 소식이라면.</i><br><br>
    누군가의 마른침 삼키는 소리. 창밖의 매미 소리마저 숨을 죽인 것 같다.<br><br>
    시계가, 정오를 알린다.`,
    nextLabel:'라디오에서 소리가 흘러나온다',
    next:'s5'
  },

  s5: {
    stageNum:5, type:'choice', scene: SVG.crowd,
    title:'5. 정오의 방송',
    narration:`지지직 — 잡음 사이로 낯선 억양의 목소리가 흘러나온다. 어려운 문어체 일본어인 데다 수신 상태마저 나빠, 방 안의 누구도 쉽게 알아듣지 못한다. 사람들은 서로의 얼굴만 바라본다. 시간이 멈춘 것 같은 몇 분.<br><br>
    방송이 끝나고, 무거운 정적이 흐른다.<br><br>
    그때 — 바깥에서 누군가 외치는 소리가 담을 넘어 들려온다.<br>
    <b>"전쟁이 끝났다! 일본이 항복했다!"</b><br><br>
    동만의 어머니가 소리 없이 눈물을 흘린다. 35년. 우리말로 마음껏 이름을 부르지 못했던 그 길고 길었던 시간이, 지금 이 순간 끝나고 있다.<br><br>
    거리 곳곳에서 함성이 터져 나온다. 오늘, 우리는 이 날을 무엇이라 부를까?`,
    prompt:'오늘, 이 날의 이름은?',
    choices:[
      { text:'광복절', correct:true, next:'ending' },
      { text:'삼일절', correct:false,
        fail:'삼일절은 1919년 3월 1일, 전국적인 만세운동을 기리는 날이다. 오늘은 그날이 아니다.' },
      { text:'제헌절', correct:false,
        fail:'제헌절은 1948년 7월 17일, 대한민국 헌법 공포를 기념하는 날이다. 오늘은 아직 그 이전이다.' }
    ]
  },

  ending: {
    type:'ending'
  }
};

/* ---------- Engine ---------- */
let currentId = 'intro';

const app = document.getElementById('app');
const riftEl = document.getElementById('rift');

function fireRift(cb){
  riftEl.classList.remove('active');
  void riftEl.offsetWidth;
  riftEl.classList.add('active');
  setTimeout(cb, 180);
}

function progressDots(activeStageNum){
  let dots = '';
  for(let i=1;i<=STAGES;i++){
    let cls = 'dot';
    if(i < activeStageNum) cls += ' done';
    else if(i === activeStageNum) cls += ' current';
    dots += `<span class="${cls}"></span>`;
  }
  return `<div class="progress">${dots}</div>`;
}

function render(){
  const s = scenes[currentId];

  if(s.type === 'intro'){
    app.innerHTML = `
      <div class="card"><div class="card-inner">
        <div class="eyebrow">HISTORY ESCAPE · 시간의 균열</div>
        <h1 class="title">${s.title}</h1>
        <div class="subtitle">${s.subtitle}</div>
        <div class="narration">${s.body}</div>
        <button class="start-btn" id="startBtn">시간의 문을 연다</button>
      </div></div>
    `;
    document.getElementById('startBtn').onclick = () => { Sound.ensure(); Sound.click(); go('s1'); };
    return;
  }

  if(s.type === 'story'){
    app.innerHTML = `
      <div class="card"><div class="card-inner">
        ${progressDots(s.stageNum)}
        <div class="eyebrow">STAGE ${s.stageNum} / ${STAGES}</div>
        <h2 class="stage-title">${s.title}</h2>
        <div class="scene">${s.scene}</div>
        <div class="narration">${s.narration}</div>
        <button class="start-btn" id="storyNextBtn">${s.nextLabel || '다음으로'}</button>
      </div></div>
    `;
    document.getElementById('storyNextBtn').onclick = () => { Sound.click(); go(s.next); };
    return;
  }

  if(s.type === 'choice'){
    const choicesHtml = s.choices.map((c,i) =>
      `<button class="choice-btn" data-i="${i}">${c.text}</button>`
    ).join('');
    app.innerHTML = `
      <div class="card"><div class="card-inner">
        ${progressDots(s.stageNum)}
        <div class="eyebrow">STAGE ${s.stageNum} / ${STAGES}</div>
        <h2 class="stage-title">${s.title}</h2>
        <div class="scene">${s.scene}</div>
        <div class="narration">${s.narration}</div>
        <div class="prompt">${s.prompt}</div>
        <div class="choices">${choicesHtml}</div>
      </div></div>
    `;
    app.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.onclick = () => {
        Sound.click();
        const choice = s.choices[Number(btn.dataset.i)];
        if(choice.correct){
          if(choice.after){ showAfter(s, choice); }
          else { go(choice.next); }
        } else {
          showFail(s, choice);
        }
      };
    });
    return;
  }

  if(s.type === 'ending'){
    app.innerHTML = `
      <div class="card"><div class="card-inner">
        <div class="ending-glow"></div>
        <svg class="taegeuk" viewBox="0 0 100 100">
          <defs>
            <clipPath id="circleClip"><circle cx="50" cy="50" r="48"/></clipPath>
          </defs>
          <circle cx="50" cy="50" r="48" fill="#26437c"/>
          <g clip-path="url(#circleClip)">
            <path d="M50 2 A24 24 0 0 1 50 50 A24 24 0 0 0 50 98 A48 48 0 0 1 50 2 Z" fill="#c23b32"/>
            <circle cx="50" cy="26" r="12" fill="#c23b32"/>
            <circle cx="50" cy="74" r="12" fill="#26437c"/>
          </g>
          <circle cx="50" cy="50" r="48" fill="none" stroke="#2a231a" stroke-width="2"/>
        </svg>
        <div class="eyebrow">1945년 8월 15일, 정오 이후</div>
        <h1 class="title">광복</h1>
        <div class="narration" style="text-align:left;">
          밖으로 나가니 거리는 이미 태극기의 물결이다. 대체 어디에 숨겨두었던 걸까 — 사람들 손마다, 품속에서 꺼낸 태극기가 들려 있다. 처음 보는 사람들끼리 부둥켜안고 울고, 웃고, 목이 터져라 만세를 외친다. 어제까지 고개를 숙이고 걷던 사람들이, 오늘은 하늘을 향해 두 팔을 뻗고 있다.<br><br>
          동만이 젖은 눈으로 나지막이 말한다.<br>
          <span class="speaker">동만</span> "이 날을 끝내 보지 못하고 떠난 분들이… 참 많아요. 감옥에서, 낯선 이국 땅에서, 이름조차 남기지 못한 채로."<br><br>
          그렇다. 오늘 이 함성 뒤에는, 이 아침을 맞지 못한 수많은 사람들의 시간이 쌓여 있다. 오늘의 기쁨은 거저 온 것이 아니다.<br><br>
          그 순간, 눈앞이 다시 흐려지기 시작한다 — 시간의 균열이 당신을 부르고 있다. 멀어지는 함성 속에서, 동만이 손을 흔든다.<br><br>
          정신을 차려보니, 박물관 특별전 앞이다. 유리창 너머로 평범한 오후의 거리가 흐르고 있다. 우리말로 이야기하고, 우리 이름으로 불리는 이 당연한 하루가 — 조금은 다르게 보인다.
        </div>
        <div class="recap">
          <b>오늘 확인한 사실들</b><br>
          · 1945년 8월 15일 정오, 일왕이 항복을 알리는 라디오 방송이 전해졌다.<br>
          · 방송은 잡음이 심하고 어려운 문어체였기에, 당시 사람들도 곧바로 알아듣기 어려웠다고 전해진다.<br>
          · 이 날을 기념하여 8월 15일을 <b>광복절</b>이라 부른다. '광복(光復)'은 '빛을 되찾다', 즉 잃었던 국권의 회복을 뜻한다.<br>
          · 1919년 3월 1일 만세운동 → <b>삼일절</b> / 1948년 7월 17일 헌법 공포 → <b>제헌절</b>과 헷갈리지 않도록.<br>
          · 광복은 특정 몇 사람이 아닌, 이름 없이 애쓴 수많은 사람들의 노력과 희생 위에 이루어졌다.
        </div>
        <div class="action-row">
          <button class="action-btn" id="restartBtn">다시 시간여행 떠나기</button>
        </div>
      </div></div>
    `;
    document.getElementById('restartBtn').onclick = () => { Sound.click(); go('intro'); };
    return;
  }
}

function showAfter(s, choice){
  app.innerHTML = `
    <div class="card"><div class="card-inner">
      ${progressDots(s.stageNum)}
      <div class="eyebrow">STAGE ${s.stageNum} / ${STAGES}</div>
      <h2 class="stage-title">${s.title}</h2>
      <div class="scene">${s.scene}</div>
      <div class="narration">${choice.after}</div>
      <button class="start-btn" id="nextBtn">다음으로</button>
    </div></div>
  `;
  document.getElementById('nextBtn').onclick = () => { Sound.click(); go(choice.next); };
}

function showFail(s, choice){
  Sound.fail();
  Sound.stopTick();
  Sound.stopStatic();
  app.innerHTML = `
    <div class="card"><div class="card-inner">
      <div class="fail-wrap">
        <div class="stamp">실패</div>
      </div>
      <h2 class="stage-title">${s.title}</h2>
      <div class="fail-text">${choice.fail}</div>
      <div class="action-row">
        <button class="action-btn" id="retryStageBtn">이 장면부터 다시</button>
        <button class="action-btn secondary" id="restartAllBtn">처음부터 다시</button>
      </div>
    </div></div>
  `;
  document.getElementById('retryStageBtn').onclick = () => { Sound.click(); go(currentId); };
  document.getElementById('restartAllBtn').onclick = () => { Sound.click(); go('intro'); };
}

function go(id){
  fireRift(() => {
    currentId = id;
    render();
    Sound.scene(id);
    window.scrollTo({top:0, behavior:'auto'});
  });
}

render();
</script>
</body>
</html>
